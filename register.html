<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Gamer Account | REDLINE ARENA — Member Registration</title>
  <meta name="description" content="Register a REDLINE ARENA gamer account to book gaming stations, manage hour packs, and track session history.">
  <meta property="og:title" content="Create Gamer Account — REDLINE ARENA">
  <meta property="og:description" content="Join REDLINE ARENA with a personal gamer profile and dashboard.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700&family=Rajdhani:wght@600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('redline_theme')||'dark');document.documentElement.setAttribute('dir',localStorage.getItem('redline_dir')||'ltr');}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="auth-corner-controls" aria-label="Appearance controls">
    <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle color theme" aria-pressed="false" title="Switch Light / Dark Mode">
      <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
    <button type="button" class="icon-btn" data-rtl-toggle aria-label="Toggle RTL direction" aria-pressed="false" title="Switch LTR / RTL Direction">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4"/><path d="M4 7h16"/><path d="m8 21-4-4 4-4"/><path d="M20 17H4"/></svg>
    </button>
  </div>

  <main id="main-content" class="auth-center-stage">
    <div class="auth-card reveal">
      <a href="index.html" class="brand-lockup auth-card-brand" aria-label="REDLINE ARENA Home">
        <svg class="brand-mark" viewBox="0 0 64 64" width="36" height="36" aria-hidden="true">
          <polygon points="32,3 58,15 54,44 32,61 10,44 6,15" fill="#090A0D" stroke="#D71932" stroke-width="3"/>
          <polygon points="18,20 38,20 45,27 36,34 46,46 37,46 28,34 25,34 25,46 18,46" fill="#FFFFFF"/>
          <polygon points="32,12 48,19 46,24 32,18 18,24 16,19" fill="#D71932"/>
          <rect x="25" y="25" width="11" height="4" fill="#D71932"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">REDLINE ARENA</span>
          <span class="brand-sub">GAMING CAFE &amp; PC LOUNGE</span>
        </span>
      </a>
      <h1 class="section-title" style="font-size:1.85rem;">CREATE ACCOUNT</h1>
      <p class="text-muted mt-1 mb-3">Create your player profile to manage station bookings, prepaid hour packs, and session history.</p>

      <form id="registerForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="regName">Full Name *</label>
          <input type="text" id="regName" class="form-control" placeholder="Alex Mercer" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regUsername">Gamer Username *</label>
          <input type="text" id="regUsername" class="form-control" placeholder="ALEX_VIPER" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email *</label>
          <input type="email" id="regEmail" class="form-control" placeholder="player@example.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPhone">Phone *</label>
          <input type="tel" id="regPhone" class="form-control" placeholder="+1 (555) 014-8890" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password *</label>
          <div class="password-wrap">
            <input type="password" id="regPassword" class="form-control" placeholder="Minimum 6 characters" required>
            <button type="button" class="password-toggle" data-pw-toggle="regPassword" aria-label="Show password" aria-pressed="false" title="Show password">
              <svg class="pw-icon-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="pw-icon-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Confirm Password *</label>
          <div class="password-wrap">
            <input type="password" id="regConfirmPassword" class="form-control" placeholder="Re-enter password" required>
            <button type="button" class="password-toggle" data-pw-toggle="regConfirmPassword" aria-label="Show confirm password" aria-pressed="false" title="Show password">
              <svg class="pw-icon-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="pw-icon-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
        </div>

        <label style="display:flex;align-items:flex-start;gap:10px;font-size:0.86rem;margin-bottom:14px;cursor:pointer;">
          <input type="checkbox" id="regTerms" required style="margin-top:4px;">
          <span>I agree to the REDLINE ARENA player guidelines and station booking terms.</span>
        </label>

        <div id="registerError" class="form-error" role="alert"></div>
        <div id="registerSuccess" style="display:none;padding:12px;border-radius:8px;background:rgba(215,25,50,0.14);border:1px solid var(--red);margin-bottom:12px;"></div>

        <button type="submit" class="btn btn-primary btn-block">CREATE GAMER ACCOUNT</button>
      </form>

      <div class="mt-3" style="padding-top:16px;border-top:1px solid var(--border-subtle);text-align:center;font-size:0.9rem;">
        <span class="text-muted">Already registered?</span>
        <a href="login.html" style="color:var(--red);font-weight:700;margin-left:6px;">Login Here</a>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
