<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamer Login | REDLINE ARENA — Access Your Gamer Dashboard</title>
  <meta name="description" content="Log into your REDLINE ARENA gamer account to manage station bookings, hour packs, and session history.">
  <meta property="og:title" content="Gamer Login — REDLINE ARENA">
  <meta property="og:description" content="Sign in to view your available gaming hours and upcoming PC reservations.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;700&family=Rajdhani:wght@600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('redline_theme')||'dark');document.documentElement.setAttribute('dir',localStorage.getItem('redline_dir')||'ltr');}catch(e){}</script>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="auth-corner-controls" aria-label="Appearance controls">
    <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle color theme" aria-pressed="false" title="Switch Light / Dark Mode">
      <svg class="theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      <svg class="theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>
    <button type="button" class="icon-btn" data-rtl-toggle aria-label="Toggle RTL direction" aria-pressed="false" title="Switch LTR / RTL Direction">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 3 4 4-4 4"/><path d="M4 7h16"/><path d="m8 21-4-4 4-4"/><path d="M20 17H4"/></svg>
    </button>
  </div>

  <main id="main-content" class="auth-center-stage">
    <div class="auth-card reveal">
      <a href="index.html" class="brand-lockup auth-card-brand" aria-label="REDLINE ARENA Home">
        <svg class="brand-mark" viewBox="0 0 64 64" width="36" height="36" aria-hidden="true">
          <polygon points="32,3 58,15 54,44 32,61 10,44 6,15" fill="#090A0D" stroke="#D71932" stroke-width="3"/>
          <polygon points="18,20 38,20 45,27 36,34 46,46 37,46 28,34 25,34 25,46 18,46" fill="#FFFFFF"/>
          <polygon points="32,12 48,19 46,24 32,18 18,24 16,19" fill="#D71932"/>
          <rect x="25" y="25" width="11" height="4" fill="#D71932"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">REDLINE ARENA</span>
          <span class="brand-sub">GAMING CAFE &amp; PC LOUNGE</span>
        </span>
      </a>
      <h1 class="section-title" style="font-size:1.85rem;text-align:center;">GAMER LOGIN</h1>
      <p class="text-muted mt-1 mb-3" style="text-align:center;">Sign in to your gamer profile or use our 1-click quick login to preview your member dashboard.</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="alex@redlinearena.demo" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="password-wrap">
            <input type="password" id="loginPassword" class="form-control" placeholder="Minimum 6 characters" required>
            <button type="button" class="password-toggle" data-pw-toggle="loginPassword" aria-label="Show password" aria-pressed="false" title="Show password">
              <svg class="pw-icon-show" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="pw-icon-hide" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;font-size:0.88rem;">
          <label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;">
            <input type="checkbox" id="loginRemember" checked>
            <span>Remember me</span>
          </label>
          <a href="#forgot" id="forgotPwLink" style="color:var(--red);font-weight:600;">Forgot Password?</a>
        </div>

        <div id="loginError" class="form-error" role="alert"></div>

        <button type="submit" class="btn btn-primary btn-block mt-1">LOGIN TO DASHBOARD</button>
        <button type="button" id="fillDemoCredsBtn" class="btn btn-secondary btn-block mt-2">QUICK MEMBER LOGIN (ALEX_VIPER)</button>
      </form>

      <div class="auth-divider">
        <span>or continue with</span>
      </div>

      <div class="social-auth-stack">
        <button type="button" class="btn btn-social btn-apple" data-social-auth="apple" aria-label="Continue with Apple">
          <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-2 .6-2.65 1.35-.58.66-1.09 1.73-.95 2.76.99.08 2.06-.51 2.68-1.26z"/>
          </svg>
          <span>Continue with Apple</span>
        </button>

        <button type="button" class="btn btn-social btn-google" data-social-auth="google" aria-label="Continue with Google">
          <svg class="social-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <div class="mt-3" style="padding-top:16px;border-top:1px solid var(--border-subtle);text-align:center;font-size:0.9rem;">
        <span class="text-muted">New to REDLINE ARENA?</span>
        <a href="register.html" style="color:var(--red);font-weight:700;margin-left:6px;">Create Account</a>
      </div>
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
